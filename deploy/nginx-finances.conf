# À utiliser SEULEMENT si Nginx est déjà installé sur le VPS (sinon, Caddy s'en charge).
# 1. Remplacer api.12-34-56-78.sslip.io par ton adresse (même valeur que DOMAINE dans .env)
# 2. sudo cp nginx-finances.conf /etc/nginx/sites-available/finances
#    sudo ln -s /etc/nginx/sites-available/finances /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. Certificat HTTPS gratuit :  sudo apt install -y certbot python3-certbot-nginx
#                                sudo certbot --nginx -d api.12-34-56-78.sslip.io
server {
    listen 80;
    server_name api.12-34-56-78.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8000;   # même valeur que PORT_API dans .env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
