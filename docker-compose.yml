# Lancement sur le VPS :  docker compose up -d --build
#
# Trois modes, choisis dans .env :
#   - COMPOSE_PROFILES=caddy : les ports 80/443 sont libres, le Caddy inclus gère le HTTPS tout seul ;
#   - COMPOSE_PROFILES=      : un Caddy ou un Nginx existe déjà sur le VPS et redirige vers l'API
#                              (voir deploy/caddy-existant.md ou deploy/nginx-finances.conf).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/finances.db
    ports:
      - "127.0.0.1:${PORT_API:-8000}:8000"   # accessible seulement depuis le VPS lui-même
    volumes:
      - donnees:/data                        # la base SQLite survit aux redéploiements
    networks:
      default:
        aliases: [finances-api]              # nom joignable par un Caddy existant en conteneur
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Caddy : reverse proxy qui obtient et renouvelle tout seul le certificat HTTPS
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

networks:
  default:
    name: finances-perso                     # nom fixe : un Caddy existant peut s'y connecter

volumes:
  donnees:
  caddy_data:
